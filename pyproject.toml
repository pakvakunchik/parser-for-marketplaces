[project]
name = "marketplaces-refresher"
version = "0.1.0"
description = ""
authors = [
    {name = "mr.Pakvak",email = "zhitnikov1408sergey@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi (==0.136.0)",
    "httpx (==0.28.1)",
    "openai (>=2.38.0,<3.0.0)",
    "pandas (==3.0.2)",
    "pydantic (==2.13.2)",
    "pydantic-settings (==2.13.1)",
    "python-dotenv (==1.2.2)",
    "sqlalchemy[asyncio] (>=2.0.49,<3.0.0)",
    "starlette (==1.0.0)",
    "uvicorn (>=0.44.0,<0.45.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "aiohttp (>=3.13.5,<4.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "python-multipart (>=0.0.30,<0.0.31)"
]

[tool.poetry]
package-mode = false

[tool.poetry.scripts]
start = 'src.main:start'

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
start = "uvicorn src.main:app --reload --host 127.0.0.1 --port 8000"
