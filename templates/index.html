<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приемка Sima-land</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; background: #f4f4f9; }
        #reader { width: 100%; max-width: 500px; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        #manual-input-container {
            margin: 20px 0; width: 100%; max-width: 500px;
            display: flex; gap: 10px;
        }
        input[type="text"] { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }

        #result-preview {
            display: none; width: 100%; max-width: 500px;
            text-align: center; margin-bottom: 20px;
            padding: 15px; border-radius: 8px;
            background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        #res-img { width: 150px; height: auto; border-radius: 5px; }
        .status-msg { color: #666; font-size: 0.8em; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="result-preview">
        <img id="res-img" src="" alt="фото">
        <h3 id="res-name" style="margin: 10px 0;"></h3>
        <p><b>Артикул:</b> <span id="res-sid"></span> | <b>В базе:</b> <span id="res-qty"></span> шт.</p>
        <div class="status-msg" id="status-timer"></div>
    </div>

    <div id="manual-input-container">
        <input type="text" id="manual-barcode" placeholder="Штрихкод или Артикул вручную">
        <button onclick="sendManualCode()">Найти</button>
    </div>

    <div id="reader"></div>

    <script>
        function processCode(code) {
            let formData = new FormData();
            formData.append('barcode', code);

            fetch('/barcode', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (!response.ok) throw new Error('Товар не найден');
                return response.json();
            })
            .then(data => {
                if (data.status === 'success') {
                    showResult(data);
                }
            })
            .catch(err => {
                alert("Ошибка: " + err.message);
                if (typeof html5QrcodeScanner !== 'undefined') html5QrcodeScanner.resume();
            });
        }
        function showResult(data) {
            document.getElementById('result-preview').style.display = 'block';
            document.getElementById('res-img').src = data.photo || '';
            document.getElementById('res-name').innerText = data.name;
            document.getElementById('res-sid').innerText = data.sid;
            document.getElementById('res-qty').innerText = data.quantity;

            let seconds = 1;
            const timer = document.getElementById('status-timer');

            const interval = setInterval(() => {
                timer.innerText = `Следующее сканирование через ${seconds} сек...`;
                seconds--;
                if (seconds < 0) {
                    clearInterval(interval);
                    timer.innerText = "";
                    if (typeof html5QrcodeScanner !== 'undefined') html5QrcodeScanner.resume();
                }
            }, 1000);
        }
        function sendManualCode() {
            const code = document.getElementById('manual-barcode').value;
            if (code) {
                processCode(code);
                document.getElementById('manual-barcode').value = ""; // очистить поле
            }
        }
        function onScanSuccess(decodedText, decodedResult) {
            html5QrcodeScanner.pause();
            processCode(decodedText);
        }
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 15, qrbox: {width: 250, height: 150} }
        );
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
